name: Agents
options:
  bundleIdPrefix: dev.wildware
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Local builds only. Release builds (.github/workflows/ios-release.yml) pass agents.version from
    # gradle.properties and a fresh build number on the command line.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    FRAMEWORK_SEARCH_PATHS: $(inherited)
    # The Kotlin framework ships Apple-silicon simulator code only.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    EXCLUDED_ARCHS[sdk=watchsimulator*]: x86_64

# Kotlin is built by Gradle, not Xcode: iosApp/build-shared.sh builds Shared for the configuration
# being built (debug or release) into shared/build/XCFrameworks/current (each scheme runs it first). The extensions and the watch link that static
# framework. The iPhone app links ComposeApp instead: the Compose screens with `shared` exported in
# the same framework, so the app carries one Kotlin runtime, not two. Its build phase builds it.
targetTemplates:
  UsesShared:
    dependencies:
      - framework: ../shared/build/XCFrameworks/current/Shared.xcframework
        embed: false
    sources:
      - Common
      - path: Privacy/PrivacyInfo.xcprivacy
        buildPhase: resources

  # The watch can't use all of Common (Live Activities and alert setup are iPhone-only), just its login and client.
  UsesSharedOnWatch:
    dependencies:
      - framework: ../shared/build/XCFrameworks/current/Shared.xcframework
        embed: false
    sources:
      - Common/Credentials.swift
      - Common/Dashboard.swift
      - WatchCommon
      - path: Privacy/PrivacyInfo.xcprivacy
        buildPhase: resources

targets:
  Agents:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Voice
      - path: Common
      - path: Privacy/PrivacyInfo.xcprivacy
        buildPhase: resources
    preBuildScripts:
      # Builds ComposeApp for just this device or simulator, and copies the screens' fonts into the app.
      - name: Build the Compose framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.." && ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Agents
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        UILaunchScreen: {}
        # Only standard HTTPS, so no export compliance questions on each TestFlight build.
        ITSAppUsesNonExemptEncryption: false
        # Lets Compose draw at 120 Hz on ProMotion screens.
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIBackgroundModes: [remote-notification, audio, fetch, processing]
        # The outbox sends what waited for signal while the app is closed.
        BGTaskSchedulerPermittedIdentifiers: [dev.wildware.agents.outbox.refresh, dev.wildware.agents.outbox.processing]
        NSFaceIDUsageDescription: Confirm it is you before approving what an agent asks.
        NSMicrophoneUsageDescription: Records the voice notes you send to your agents.
        NSSpeechRecognitionUsageDescription: Writes down what you say in a voice note, so your agents can read it.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.wildware.agents
            CFBundleURLSchemes: [agents]
        INAlternativeAppNames:
          - INAlternativeAppName: Agent Dashboard
          - INAlternativeAppName: Dashboard
    entitlements:
      path: App/Agents.entitlements
      properties:
        # Stays "development": archives are signed for development, and the App Store export
        # re-signs with the distribution profile, which turns it into "production".
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.security.application-groups: [group.dev.wildware.agents]
        keychain-access-groups: [$(AppIdentifierPrefix)dev.wildware.agents.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.wildware.agents
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: $(inherited) -framework ComposeApp
        # Swift files shared with the extensions import ComposeApp here and Shared there.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) COMPOSE_APP
        # Gradle reads and writes outside the sandbox Xcode gives build scripts.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - target: AgentsWidgets
      - target: AgentsShare
      - target: AgentsNotificationService
      - target: AgentsNotificationContent
      - target: AgentsWatch

  # The Apple Watch app, shipped inside the iPhone app. The phone hands it its key over WatchConnectivity.
  AgentsWatch:
    type: application
    platform: watchOS
    templates: [UsesSharedOnWatch]
    sources:
      - path: Watch
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Agents
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        WKApplication: true
        ITSAppUsesNonExemptEncryption: false
        WKCompanionAppBundleIdentifier: dev.wildware.agents
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Watch/Watch.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.wildware.agents]
        keychain-access-groups: [$(AppIdentifierPrefix)dev.wildware.agents.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.wildware.agents.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: AgentsWatchWidgets

  AgentsWatchWidgets:
    type: app-extension
    platform: watchOS
    templates: [UsesSharedOnWatch]
    sources:
      - path: WatchWidgets
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Agents
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WatchWidgets/WatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.wildware.agents]
        keychain-access-groups: [$(AppIdentifierPrefix)dev.wildware.agents.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.wildware.agents.watchkitapp.widgets

  AgentsWidgets:
    type: app-extension
    platform: iOS
    templates: [UsesShared]
    sources:
      - Widgets
      - App/Intents
      - Voice
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Agents
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.wildware.agents]
        keychain-access-groups: [$(AppIdentifierPrefix)dev.wildware.agents.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.wildware.agents.widgets
        TARGETED_DEVICE_FAMILY: "1,2"

  AgentsShare:
    type: app-extension
    platform: iOS
    templates: [UsesShared]
    sources:
      - path: Share
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Agents
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 4
    entitlements:
      path: Share/Share.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.wildware.agents]
        keychain-access-groups: [$(AppIdentifierPrefix)dev.wildware.agents.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.wildware.agents.share
        TARGETED_DEVICE_FAMILY: "1,2"

  AgentsNotificationService:
    type: app-extension
    platform: iOS
    templates: [UsesShared]
    sources:
      - path: NotificationService
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: Agents
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: NotificationService/NotificationService.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.wildware.agents]
        keychain-access-groups: [$(AppIdentifierPrefix)dev.wildware.agents.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.wildware.agents.notifications
        TARGETED_DEVICE_FAMILY: "1,2"

  AgentsNotificationContent:
    type: app-extension
    platform: iOS
    templates: [UsesShared]
    dependencies:
      # Importing it only for its protocol doesn't link it, and without it the extension traps at launch.
      - sdk: UserNotificationsUI.framework
    sources:
      - path: NotificationContent
    info:
      path: NotificationContent/Info.plist
      properties:
        CFBundleDisplayName: Agents
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.content-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationViewController
          NSExtensionAttributes:
            # Content extensions can't match categories by pattern, so request categories are a fixed set.
            UNNotificationExtensionCategory: [MESSAGE, UPDATE, REQUEST, REQUEST.confirm, REQUEST.text, REQUEST.options.1, REQUEST.options.2, REQUEST.options.3, REQUEST.options.4]
            UNNotificationExtensionInitialContentSizeRatio: 0.3
            UNNotificationExtensionDefaultContentHidden: true
            UNNotificationExtensionUserInteractionEnabled: true
    entitlements:
      path: NotificationContent/NotificationContent.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.wildware.agents]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.wildware.agents.notificationcontent
        TARGETED_DEVICE_FAMILY: "1,2"

  # Not shipped: draws the widget and Live Activity views to PNGs (see .github/workflows/screenshots.yml).
  AgentsScreenshots:
    type: bundle.unit-test
    platform: iOS
    templates: [UsesShared]
    sources:
      - path: Widgets
        excludes: [AgentsWidgetBundle.swift]
      - App/Intents
      - Voice
      - path: NotificationContent
        excludes: [Info.plist, "*.entitlements"]
      - Screenshots
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.wildware.agents.screenshots
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES

  AgentsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Agents
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.wildware.agents.uitests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Agents

schemes:
  Agents:
    build:
      targets:
        Agents: all
      preActions:
        - name: Build Kotlin
          settingsTarget: Agents
          script: |
            "$SRCROOT/build-shared.sh"
    run:
      config: Debug
    archive:
      config: Release

  AgentsWatch:
    build:
      targets:
        AgentsWatch: all
      preActions:
        - name: Build Kotlin
          settingsTarget: AgentsWatch
          script: |
            "$SRCROOT/build-shared.sh"
    run:
      config: Debug
    archive:
      config: Release

  Screenshots:
    build:
      targets:
        Agents: all
      preActions:
        - name: Build Kotlin
          settingsTarget: Agents
          script: |
            "$SRCROOT/build-shared.sh"
    test:
      config: Debug
      targets: [AgentsScreenshots, AgentsUITests]
