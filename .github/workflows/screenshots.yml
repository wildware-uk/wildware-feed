name: screenshots

# Manual only: Mac minutes bill at ten times the Linux rate.
on:
  workflow_dispatch:
    inputs:
      parts:
        description: 'What to draw: all, or watch for only the Apple Watch app'
        type: choice
        options: [all, watch]
        default: all

jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: iosApp/build-shared.sh
        timeout-minutes: 20
      - run: brew install xcodegen
        timeout-minutes: 5
      - run: xcodegen generate --spec iosApp/project.yml
        timeout-minutes: 4
      - name: Boot an iPhone simulator
        if: inputs.parts != 'watch'
        timeout-minutes: 6
        run: |
          id=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | test("^iPhone [0-9]+ Pro$"))] | last | .udid')
          echo "Using $id"
          echo "SIM=$id" >> "$GITHUB_ENV"
          xcrun simctl boot "$id"
          xcrun simctl bootstatus "$id"
          xcrun simctl ui "$id" appearance dark
          xcrun simctl status_bar "$id" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
      # The first test build also builds the Compose framework, which takes a few minutes.
      - name: Draw the screenshots
        if: inputs.parts != 'watch'
        timeout-minutes: 25
        run: |
          set -o pipefail
          # A TEST_RUNNER_ environment variable reaches the tests without the prefix; a build setting does not.
          TEST_RUNNER_SCREENSHOT_DIR="$PWD/screenshots" xcodebuild test \
            -project iosApp/Agents.xcodeproj \
            -scheme Screenshots \
            -destination "id=$SIM" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            | tee test.log | grep -E "error:|Test Case .*(passed|failed)|TEST (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "TEST SUCCEEDED" test.log
      # After the iPhone's pictures, and allowed to fail: a stuck iPad simulator must not cost them.
      - name: Boot an iPad simulator
        if: inputs.parts != 'watch'
        timeout-minutes: 12
        continue-on-error: true
        id: ipad
        run: |
          id=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | test("^iPad Pro"))] | last | .udid')
          echo "Using $id"
          echo "IPAD=$id" >> "$GITHUB_ENV"
          xcrun simctl boot "$id"
          xcrun simctl bootstatus "$id"
          xcrun simctl ui "$id" appearance dark
          xcrun simctl status_bar "$id" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3
      - name: Draw the iPad's feed
        if: steps.ipad.outcome == 'success'
        timeout-minutes: 12
        continue-on-error: true
        run: |
          set -o pipefail
          TEST_RUNNER_SCREENSHOT_DIR="$PWD/screenshots" xcodebuild test \
            -project iosApp/Agents.xcodeproj \
            -scheme Screenshots \
            -destination "id=$IPAD" \
            -only-testing:AgentsUITests/AppScreenshots/testSampleFeed \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            | tee test-ipad.log | grep -E "error:|Test Case .*(passed|failed)|TEST (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "TEST SUCCEEDED" test-ipad.log
      # The watch app on its sample questions (WatchScreenshots.swift, debug builds only): the
      # inbox, then a question. App Store Connect wants one of these because the app ships a watch app.
      - name: Boot a watch simulator
        id: watch
        timeout-minutes: 12
        continue-on-error: true
        run: |
          id=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | test("^Apple Watch Ultra"))] | last | .udid // empty')
          [ -n "$id" ] || id=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | test("^Apple Watch Series"))] | last | .udid // empty')
          [ -n "$id" ] || { echo "::error::no Apple Watch simulator on this runner"; exit 1; }
          echo "Using $id"
          echo "WATCH=$id" >> "$GITHUB_ENV"
          xcrun simctl boot "$id"
          xcrun simctl bootstatus "$id"
      - name: Build the watch app
        if: steps.watch.outcome == 'success'
        id: watchbuild
        timeout-minutes: 20
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build \
            -project iosApp/Agents.xcodeproj \
            -scheme AgentsWatch \
            -configuration Debug \
            -destination "id=$WATCH" \
            -derivedDataPath build/watch \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            | tee watch.log | grep -E "error:|\*\* " || true
          grep -q "BUILD SUCCEEDED" watch.log
      - name: Draw the watch app
        if: steps.watchbuild.outcome == 'success'
        timeout-minutes: 6
        continue-on-error: true
        run: |
          app=$(find build/watch/Build/Products -path "*watchsimulator*" -name "AgentsWatch.app" | head -1)
          echo "Installing $app"
          xcrun simctl install "$WATCH" "$app"
          mkdir -p screenshots
          for pair in inbox:-screenshots question:-screenshots-question; do
            xcrun simctl launch "$WATCH" dev.wildware.agents.watchkitapp "${pair#*:}"
            sleep 10
            xcrun simctl io "$WATCH" screenshot "screenshots/watch-${pair%%:*}.png"
            xcrun simctl terminate "$WATCH" dev.wildware.agents.watchkitapp || true
          done
          ls -l screenshots/watch-*.png
      - if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: screenshots
          path: |
            screenshots
            test.log
            test-ipad.log
            watch.log
