name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :shared:jvmTest

  ios:
    runs-on: macos-26
    needs: shared-tests
    # Mac minutes are billed at ten times the Linux rate, so a hang must not run for hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :shared:assembleSharedDebugXCFramework
      - run: brew install xcodegen
        timeout-minutes: 5
      - name: Generate the Xcode project
        timeout-minutes: 4
        run: |
          xcodegen generate --spec iosApp/project.yml &
          pid=$!
          for _ in $(seq 120); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          if kill -0 $pid 2>/dev/null; then
            echo "xcodegen is stuck; where it is:"
            sample $pid 3 | grep -E "XcodeGen|ProjectSpec|XcodeProj" | head -40
            kill $pid
            exit 1
          fi
          wait $pid
      - name: Build app and extensions for the simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project iosApp/Agents.xcodeproj \
            -scheme Agents \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: The alert extension links the framework iOS looks up when it starts
        timeout-minutes: 2
        run: |
          appex=$(find ~/Library/Developer/Xcode/DerivedData -type f -name AgentsNotificationContent -path "*AgentsNotificationContent.appex/*" | head -1)
          echo "binary: ${appex:-not found}"
          otool -L "$appex"
          otool -L "$appex" | grep -q UserNotificationsUI.framework
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build.log
