name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :shared:jvmTest

  compose-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Ubuntu has no colour emoji font, and the screenshots show emoji reactions.
      - name: Install an emoji font
        timeout-minutes: 5
        run: sudo apt-get update -q && sudo apt-get install -yq fonts-noto-color-emoji
      - name: Build the desktop app
        timeout-minutes: 10
        run: ./gradlew :composeApp:desktopJar
      - name: Draw the screenshots
        timeout-minutes: 10
        run: ./gradlew :composeApp:desktopTest
      - if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: compose-screenshots
          path: composeApp/build/screenshots/*.png
          if-no-files-found: warn

  ios:
    runs-on: macos-26
    needs: shared-tests
    # Mac minutes are billed at ten times the Linux rate, so a hang must not run for hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :shared:assembleSharedDebugXCFramework
        timeout-minutes: 10
      # The app's own build phase runs this again through embedAndSignAppleFrameworkForXcode, and finds it done.
      - name: Build the Compose framework for the simulator
        timeout-minutes: 15
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64
      - name: Shared tests on the iPhone simulator
        timeout-minutes: 10
        run: ./gradlew :shared:iosSimulatorArm64Test --no-daemon
      - run: brew install xcodegen
        timeout-minutes: 5
      - name: Generate the Xcode project
        timeout-minutes: 4
        run: |
          xcodegen generate --spec iosApp/project.yml &
          pid=$!
          for _ in $(seq 120); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          if kill -0 $pid 2>/dev/null; then
            echo "xcodegen is stuck; where it is:"
            sample $pid 3 | grep -E "XcodeGen|ProjectSpec|XcodeProj" | head -40
            kill $pid
            exit 1
          fi
          wait $pid
      - name: Build app and extensions for the simulator
        timeout-minutes: 15
        run: |
          set -o pipefail
          xcodebuild build \
            -project iosApp/Agents.xcodeproj \
            -scheme Agents \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Build the watch app and its complication for the watch simulator
        timeout-minutes: 10
        run: |
          set -o pipefail
          xcodebuild build \
            -project iosApp/Agents.xcodeproj \
            -scheme AgentsWatch \
            -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | tee watch-build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" watch-build.log
      - name: The iPhone app carries the watch app, and the watch app its complication
        timeout-minutes: 2
        run: |
          app=$(find ~/Library/Developer/Xcode/DerivedData -type d -name Agents.app -path "*Debug-iphonesimulator*" | head -1)
          ls "$app/Watch"
          [ -d "$app/Watch/AgentsWatch.app/PlugIns/AgentsWatchWidgets.appex" ]
      - name: The iPhone app carries the Compose screens and their fonts
        timeout-minutes: 2
        run: |
          app=$(find ~/Library/Developer/Xcode/DerivedData -type d -name Agents.app -path "*Debug-iphonesimulator*" | head -1)
          code="$app/Agents.debug.dylib"
          [ -f "$code" ] || code="$app/Agents"
          nm "$code" | grep -q MainViewController
          find "$app" -name "*.ttf" | grep -q geist
      - name: The alert extension links the framework iOS looks up when it starts
        timeout-minutes: 2
        run: |
          # Debug builds keep the code in a .debug.dylib beside a stub binary; check whichever holds it.
          dir=$(find ~/Library/Developer/Xcode/DerivedData -type d -name AgentsNotificationContent.appex -path "*Debug-iphonesimulator*" | head -1)
          code="$dir/AgentsNotificationContent.debug.dylib"
          [ -f "$code" ] || code="$dir/AgentsNotificationContent"
          otool -L "$code"
          otool -L "$code" | grep -q UserNotificationsUI.framework
      - if: failure()
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: xcodebuild-log
          path: |
            build.log
            watch-build.log
