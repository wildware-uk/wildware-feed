name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # The iOS build rejects some characters in test names that the JVM takes; catch them here, in seconds.
      - name: Test names Kotlin/Native accepts
        timeout-minutes: 2
        run: python3 .github/scripts/check-native-test-names.py
      # The App Store Connect helper the releases use: its token and its notarisation wait, offline.
      - name: Release scripts' own tests
        timeout-minutes: 2
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :shared:jvmTest

  compose-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Ubuntu has no colour emoji font, and the screenshots show emoji reactions.
      - name: Set up an emoji font
        timeout-minutes: 5
        uses: ./.github/actions/setup-emoji-font
      - name: Build the desktop app
        timeout-minutes: 10
        run: ./gradlew :composeApp:desktopJar
      - name: Draw the screenshots
        timeout-minutes: 20
        run: ./gradlew :composeApp:desktopTest
      - if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: compose-screenshots
          path: composeApp/build/screenshots/*.png
          if-no-files-found: warn

  # The parity suite against the TypeScript server it must match, cloned at the commit pinned in
  # server/parity/run-against-ts.sh (TS_SERVER_REF).
  server-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: gradle/actions/setup-gradle@v4
      # The server derives video posters and audio waveforms with ffmpeg.
      - name: Set up ffmpeg
        timeout-minutes: 8
        uses: ./.github/actions/setup-ffmpeg
      - name: Compile the suite
        timeout-minutes: 10
        run: ./gradlew --no-daemon :server-parity:testClasses
      - name: Build the TypeScript server and run the suite against it
        timeout-minutes: 30
        run: server/parity/run-against-ts.sh
      - if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: server-parity-report
          path: server/parity/build/reports/tests/test
          if-no-files-found: warn

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The runner's Android SDK has its licences accepted, so Gradle fetches the platform it needs.
      - name: Build the Android app
        timeout-minutes: 15
        run: ./gradlew --no-daemon :androidApp:assembleDebug
      - name: Android unit tests
        timeout-minutes: 10
        run: ./gradlew --no-daemon :androidApp:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # The Kotlin server: its own tests, then the parity suite for the phases it has reached, on a
  # database the TypeScript server built (server/parity/run-against-kotlin.sh).
  server-kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: gradle/actions/setup-gradle@v4
      - name: Set up ffmpeg
        timeout-minutes: 8
        uses: ./.github/actions/setup-ffmpeg
      - name: Unit tests
        timeout-minutes: 10
        run: ./gradlew --no-daemon :server:test
      - name: Parity against the Kotlin server
        timeout-minutes: 35
        run: server/parity/run-against-kotlin.sh
      - if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: server-kotlin-reports
          path: |
            server/build/reports/tests/test
            server/parity/build/reports/tests/test
          if-no-files-found: warn

  # The same, with the Kotlin server on Postgres and its media in an S3-compatible bucket (a
  # throwaway SeaweedFS), as it runs on Heroku with Cloudflare R2.
  server-kotlin-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: feedtest
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_TEST_URL: postgres://postgres:feedtest@127.0.0.1:5432/postgres
      S3_TEST_ENDPOINT: http://127.0.0.1:9000
      S3_TEST_BUCKET: feed-test
      S3_TEST_ACCESS_KEY_ID: feedtestkey
      S3_TEST_SECRET_ACCESS_KEY: feedtestsecret123
      KOTLIN_DATABASE_URL: postgres://postgres:feedtest@127.0.0.1:5432/postgres
      KOTLIN_S3_ENDPOINT: http://127.0.0.1:9000
      KOTLIN_S3_ACCESS_KEY_ID: feedtestkey
      KOTLIN_S3_SECRET_ACCESS_KEY: feedtestsecret123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: gradle/actions/setup-gradle@v4
      - name: Set up ffmpeg
        timeout-minutes: 8
        uses: ./.github/actions/setup-ffmpeg
      # An S3-compatible stand-in for R2. MinIO no longer publishes images, so SeaweedFS's S3 gateway,
      # pinned. A service container can't be given its command, so it starts here.
      - name: Start an S3-compatible server
        timeout-minutes: 5
        run: |
          echo '{"identities":[{"name":"feedtest","credentials":[{"accessKey":"feedtestkey","secretKey":"feedtestsecret123"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > "$RUNNER_TEMP/s3.json"
          docker run -d --name s3 -p 127.0.0.1:9000:8333 -v "$RUNNER_TEMP/s3.json:/etc/s3.json:ro" \
            chrislusf/seaweedfs:3.97 server -s3 -s3.config=/etc/s3.json -dir=/data
          for i in $(seq 90); do [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/)" != 000 ] && exit 0; sleep 1; done
          docker logs s3 | tail -20; exit 1
      - name: Unit tests on Postgres and S3
        timeout-minutes: 10
        run: ./gradlew --no-daemon :server:test
      - name: Parity against the Kotlin server on Postgres and S3
        timeout-minutes: 35
        run: server/parity/run-against-kotlin.sh
      - if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: server-kotlin-postgres-reports
          path: |
            server/build/reports/tests/test
            server/parity/build/reports/tests/test
          if-no-files-found: warn

  # The server's container image: built from the distribution and smoke-tested. Never pushed.
  server-image:
    runs-on: ubuntu-latest
    # The image carries the web app, whose build takes a few minutes of its own.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and smoke-test the image
        timeout-minutes: 30
        run: server/deploy/smoke-image.sh

  # The app built for the browser (Kotlin/Wasm), served by the server: the shared tests on the web
  # engine, then a headless Chromium that signs in, reads the feed, replies and plays a video.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared tests on Wasm
        timeout-minutes: 15
        run: ./gradlew --no-daemon :shared:wasmJsNodeTest
      - name: Build the web app and the server
        timeout-minutes: 20
        run: ./gradlew --no-daemon :server:installDist
      # The server derives video posters with ffmpeg, and the smoke test makes its clip with it.
      - name: Set up ffmpeg
        timeout-minutes: 8
        uses: ./.github/actions/setup-ffmpeg
      - name: Sign in, read, reply and play a video in a headless browser
        timeout-minutes: 20
        # The runner's own Chrome, when it has one: Playwright's browser download installs its
        # system libraries through apt, the same slow mirrors.
        run: CHROME="$(command -v google-chrome || true)" SKIP_DIST=1 SHOTS=web-screenshots server/deploy/smoke-web.sh
      - if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: web-screenshots
          path: web-screenshots/*.png
          if-no-files-found: warn

  ios:
    runs-on: macos-26
    needs: shared-tests
    # Mac minutes are billed at ten times the Linux rate, so a hang must not run for hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: iosApp/build-shared.sh
        timeout-minutes: 20
      # The app's own build phase runs this again through embedAndSignAppleFrameworkForXcode, and finds it done.
      - name: Build the Compose framework for the simulator
        timeout-minutes: 15
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64
      - name: Shared tests on the iPhone simulator
        timeout-minutes: 10
        run: ./gradlew :shared:iosSimulatorArm64Test --no-daemon
      - run: brew install xcodegen
        timeout-minutes: 5
      - name: Generate the Xcode project
        timeout-minutes: 4
        run: |
          xcodegen generate --spec iosApp/project.yml &
          pid=$!
          for _ in $(seq 120); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          if kill -0 $pid 2>/dev/null; then
            echo "xcodegen is stuck; where it is:"
            sample $pid 3 | grep -E "XcodeGen|ProjectSpec|XcodeProj" | head -40
            kill $pid
            exit 1
          fi
          wait $pid
      - name: Build app and extensions for the simulator
        timeout-minutes: 15
        run: |
          set -o pipefail
          xcodebuild build \
            -project iosApp/Agents.xcodeproj \
            -scheme Agents \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Build the watch app and its complication for the watch simulator
        timeout-minutes: 10
        run: |
          set -o pipefail
          xcodebuild build \
            -project iosApp/Agents.xcodeproj \
            -scheme AgentsWatch \
            -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | tee watch-build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" watch-build.log
      - name: The iPhone app carries the watch app, and the watch app its complication
        timeout-minutes: 2
        run: |
          app=$(find ~/Library/Developer/Xcode/DerivedData -type d -name Agents.app -path "*Debug-iphonesimulator*" | head -1)
          ls "$app/Watch"
          [ -d "$app/Watch/AgentsWatch.app/PlugIns/AgentsWatchWidgets.appex" ]
      - name: The iPhone app carries the Compose screens and their fonts
        timeout-minutes: 2
        run: |
          app=$(find ~/Library/Developer/Xcode/DerivedData -type d -name Agents.app -path "*Debug-iphonesimulator*" | head -1)
          code="$app/Agents.debug.dylib"
          [ -f "$code" ] || code="$app/Agents"
          nm "$code" | grep -q MainViewController
          find "$app" -name "*.ttf" | grep -q geist
      - name: The alert extension links the framework iOS looks up when it starts
        timeout-minutes: 2
        run: |
          # Debug builds keep the code in a .debug.dylib beside a stub binary; check whichever holds it.
          dir=$(find ~/Library/Developer/Xcode/DerivedData -type d -name AgentsNotificationContent.appex -path "*Debug-iphonesimulator*" | head -1)
          code="$dir/AgentsNotificationContent.debug.dylib"
          [ -f "$code" ] || code="$dir/AgentsNotificationContent"
          otool -L "$code"
          otool -L "$code" | grep -q UserNotificationsUI.framework
      - if: failure()
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: xcodebuild-log
          path: |
            build.log
            watch-build.log
