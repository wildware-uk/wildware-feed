name: desktop-release

# Builds the desktop installers, and on a version tag publishes them as a GitHub Release.
#
#   - Push a tag `v1.2.3` (matching agents.version in gradle.properties): builds everything and
#     publishes the release with install notes.
#   - Run it by hand from the Actions tab: builds everything and keeps the files as run artifacts
#     only. The version box can override agents.version for a test build.
#
# Never on pull requests or ordinary pushes: Mac and Windows minutes are limited.
#
# Signing is optional and turns on by itself when its secrets exist (docs/INSTALL.md lists them):
#   Mac:     MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD, APPLE_TEAM_ID, then for notarising
#            ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64.
#   Windows: SignPath (free signing for open-source projects, docs/CODE_SIGNING.md): the secret
#            SIGNPATH_API_TOKEN and the variables SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG,
#            SIGNPATH_SIGNING_POLICY_SLUG (SIGNPATH_ARTIFACT_CONFIGURATION_SLUG is optional).
#            Tags are always signed; a run by hand only when its sign_windows box is ticked.
#   Android: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
#            Without them there is no APK or AAB at all: a debug-signed build is never published.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 1.2.3. Leave empty to use agents.version.'
        required: false
        default: ''
      sign_windows:
        description: 'Sign the Windows files through SignPath (needs its settings; asks for approval there).'
        type: boolean
        required: false
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        name: Work out the version
        timeout-minutes: 1
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          file_version="$(grep '^agents.version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            if [ "$version" != "$file_version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match agents.version=$file_version in gradle.properties. Bump it, commit, then tag."
              exit 1
            fi
          else
            version="${INPUT_VERSION:-$file_version}"
          fi
          # The Mac and Windows installers only take MAJOR.MINOR.PATCH, with MAJOR at least 1.
          if ! echo "$version" | grep -Eq '^[1-9][0-9]*\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$version' must look like 1.2.3 (first number at least 1)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Wildware Feed $version"

  mac:
    needs: version
    runs-on: macos-26
    # Mac minutes are billed at ten times the Linux rate; notarising can take a while, but not hours.
    timeout-minutes: 50
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
      notarized: ${{ steps.notarize.outputs.notarized }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      HAS_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' && secrets.MACOS_CERT_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
      HAS_NOTARY: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      # A keychain of its own for this run only, deleted at the end whatever happens.
      - name: Load the Developer ID certificate
        id: signing
        timeout-minutes: 3
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ "$HAS_CERT" != "true" ]; then
            echo "No Mac signing secrets: building unsigned."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/agents-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          if [ -z "$identity" ]; then
            echo "::error::The certificate holds no 'Developer ID Application' identity."
            exit 1
          fi
          case "$identity" in
            *"($TEAM_ID)"*) ;;
            *) echo "::error::The certificate's team isn't APPLE_TEAM_ID."; exit 1 ;;
          esac
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          # Compose adds the "Developer ID Application: " part itself.
          echo "identity=${identity#Developer ID Application: }" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build the .dmg (Apple silicon)
        timeout-minutes: 20
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          IDENTITY: ${{ steps.signing.outputs.identity }}
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: |
          set -euo pipefail
          args=(--no-daemon "-Pagents.version=$VERSION")
          if [ "$SIGNED" = "true" ]; then
            args+=("-Pcompose.desktop.mac.sign=true" "-Pcompose.desktop.mac.signing.identity=$IDENTITY" "-Pcompose.desktop.mac.signing.keychain=$KEYCHAIN")
          fi
          ./gradlew "${args[@]}" :composeApp:packageDmg
          mkdir -p dist
          cp composeApp/build/compose/binaries/main/dmg/*.dmg "dist/Wildware-Feed-$VERSION-mac-arm64.dmg"

      - name: Sign the .dmg itself
        if: steps.signing.outputs.signed == 'true'
        timeout-minutes: 5
        env:
          IDENTITY: ${{ steps.signing.outputs.identity }}
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: |
          codesign --force --timestamp --keychain "$KEYCHAIN" --sign "Developer ID Application: $IDENTITY" "dist/Wildware-Feed-$VERSION-mac-arm64.dmg"

      - name: Notarise and staple
        id: notarize
        timeout-minutes: 35
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          if [ "$SIGNED" != "true" ] || [ "$HAS_NOTARY" != "true" ]; then
            echo "Not notarising: needs both the signing and the App Store Connect key secrets."
            echo "notarized=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          key="$RUNNER_TEMP/asc-key.p8"
          printf '%s' "$ASC_KEY_P8" | base64 --decode > "$key"
          dmg="dist/Wildware-Feed-$VERSION-mac-arm64.dmg"
          xcrun notarytool submit "$dmg" --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait --timeout 30m
          rm -f "$key"
          xcrun stapler staple "$dmg"
          echo "notarized=true" >> "$GITHUB_OUTPUT"

      # Gatekeeper's own verdict, as a Mac that downloaded the files would give it. Fails the run
      # rather than publish a "signed and notarised" build that a Mac would still refuse.
      - name: Check Gatekeeper accepts the .dmg and the app
        if: steps.notarize.outputs.notarized == 'true'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          dmg="dist/Wildware-Feed-$VERSION-mac-arm64.dmg"
          xcrun stapler validate "$dmg"
          spctl -a -vv -t open --context context:primary-signature "$dmg"
          spctl -a -vv -t install "$dmg" || echo "::notice::spctl -t install has no verdict for a .dmg on this macOS; the open check above is the one that counts."
          mount="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg" >/dev/null
          trap 'hdiutil detach "$mount" -quiet || true' EXIT
          app="$(find "$mount" -maxdepth 1 -name '*.app' | head -1)"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl -a -vv -t exec "$app"

      - name: Delete the signing keychain
        if: always()
        timeout-minutes: 2
        run: |
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/asc-key.p8"
          if [ -f "$RUNNER_TEMP/agents-signing.keychain-db" ]; then security delete-keychain "$RUNNER_TEMP/agents-signing.keychain-db"; fi

      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: Wildware-Feed-${{ needs.version.outputs.version }}-mac
          path: dist/*
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      signpath: ${{ steps.signpath.outputs.on }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_PROJECT_SLUG != '' && vars.SIGNPATH_SIGNING_POLICY_SLUG != '' }}
      WANT_SIGNING: ${{ github.ref_type == 'tag' || github.event.inputs.sign_windows == 'true' }}
    steps:
      # Signing itself happens in the windows-sign job, on Linux, so the wait for its approval
      # costs no Windows minutes.
      - name: Will SignPath sign this build?
        id: signpath
        timeout-minutes: 1
        run: |
          if [ "$HAS_SIGNPATH" != "true" ]; then
            echo "No SignPath settings: building unsigned."
            echo "on=false" >> "$GITHUB_OUTPUT"
          elif [ "$WANT_SIGNING" != "true" ]; then
            echo "A run by hand without sign_windows ticked: building unsigned."
            echo "on=false" >> "$GITHUB_OUTPUT"
          else
            echo "SignPath signs these files in the windows-sign job."
            echo "on=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Compose downloads the WiX toolset it needs for the .msi the first time.
      - name: Build the .msi and the portable folder
        timeout-minutes: 25
        run: |
          set -euo pipefail
          ./gradlew --no-daemon "-Pagents.version=$VERSION" :composeApp:packageMsi :composeApp:createDistributable
          mkdir -p dist
          cp composeApp/build/compose/binaries/main/msi/*.msi "dist/Wildware-Feed-$VERSION-windows-x64.msi"

      # SignPath only signs files whose name and version match its settings, so check them here first.
      - name: Check the .exe names the app, its maker and its version
        timeout-minutes: 2
        shell: pwsh
        run: |
          $info = (Get-Item 'composeApp\build\compose\binaries\main\app\Wildware Feed\Wildware Feed.exe').VersionInfo
          $info | Format-List ProductName, CompanyName, ProductVersion, FileVersion, FileDescription, LegalCopyright
          $want = [ordered]@{ ProductName = 'Wildware Feed'; CompanyName = 'Wildware'; ProductVersion = $env:VERSION; FileVersion = $env:VERSION }
          foreach ($key in $want.Keys) {
            if ($info.$key -ne $want[$key]) {
              Write-Output "::error::Wildware Feed.exe has $key '$($info.$key)', not '$($want[$key])'."
              exit 1
            }
          }
          if (-not $info.FileDescription) { Write-Output "::error::Wildware Feed.exe has no description."; exit 1 }

      - name: Zip the portable folder
        timeout-minutes: 5
        run: 7z a -tzip "dist/Wildware-Feed-$VERSION-windows-x64-portable.zip" "./composeApp/build/compose/binaries/main/app/Wildware Feed"
      # When SignPath signs, these are the unsigned files: windows-sign swaps the signed ones in and
      # uploads the Wildware-Feed-<version>-windows artifact that the release uses.
      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: ${{ steps.signpath.outputs.on == 'true' && format('windows-unsigned-{0}', env.VERSION) || format('Wildware-Feed-{0}-windows', env.VERSION) }}
          path: dist/*
          if-no-files-found: error

  # Signs the .msi (and the Wildware Feed.exe inside it) and the portable Wildware Feed.exe through
  # SignPath, which checks they were built by this workflow from this repo (docs/CODE_SIGNING.md).
  # Every request waits for someone to approve it in SignPath.
  windows-sign:
    needs: [version, windows]
    if: needs.windows.outputs.signpath == 'true'
    runs-on: ubuntu-latest
    # Up to two hours for the approval, plus a few minutes either side.
    timeout-minutes: 140
    permissions:
      actions: read
      contents: read
    outputs:
      signed: ${{ steps.place.outputs.signed }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        with:
          name: windows-unsigned-${{ needs.version.outputs.version }}
          path: dist
      - name: Pick out the files to sign
        timeout-minutes: 2
        run: |
          set -euo pipefail
          mkdir -p to-sign
          cp "dist/Wildware-Feed-$VERSION-windows-x64.msi" to-sign/
          unzip -q -j "dist/Wildware-Feed-$VERSION-windows-x64-portable.zip" "Wildware Feed/Wildware Feed.exe" -d to-sign
          ls -l to-sign
      # SignPath fetches the files from GitHub itself, which is how it knows where they came from.
      - name: Upload the unsigned files for SignPath
        id: upload
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: signpath-request-${{ needs.version.outputs.version }}
          path: to-sign/*
          if-no-files-found: error
          retention-days: 1
      # The artifact configuration it signs with is .signpath/artifact-configuration.xml.
      - name: Sign with SignPath
        uses: signpath/github-action-submit-signing-request@4a84eb4ad763290f059275786f2deed97c2c672b # v3.1
        timeout-minutes: 125
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed
          parameters: |
            version: ${{ toJSON(needs.version.outputs.version) }}
      - name: Put the signed files in place
        id: place
        timeout-minutes: 3
        run: |
          set -euo pipefail
          ls -l signed
          exe="signed/Wildware Feed.exe"
          msi="signed/Wildware-Feed-$VERSION-windows-x64.msi"
          # Refuse anything that came back without a signature in it.
          python3 - "$exe" "$msi" <<'PY'
          import struct, sys
          exe, msi = (open(p, "rb").read() for p in sys.argv[1:])
          pe = struct.unpack_from("<I", exe, 0x3C)[0]
          dirs = pe + 24 + (112 if struct.unpack_from("<H", exe, pe + 24)[0] == 0x20B else 96)
          if struct.unpack_from("<I", exe, dirs + 4 * 8 + 4)[0] == 0:
              sys.exit("Wildware Feed.exe came back unsigned")
          if "\x05DigitalSignature".encode("utf-16-le") not in msi:
              sys.exit("The .msi came back unsigned")
          PY
          cp "$msi" dist/
          mkdir -p "portable/Wildware Feed"
          cp "$exe" "portable/Wildware Feed/"
          (cd portable && zip -q "../dist/Wildware-Feed-$VERSION-windows-x64-portable.zip" "Wildware Feed/Wildware Feed.exe")
          unzip -p "dist/Wildware-Feed-$VERSION-windows-x64-portable.zip" "Wildware Feed/Wildware Feed.exe" | cmp - "$exe"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: Wildware-Feed-${{ needs.version.outputs.version }}-windows
          path: dist/*
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install rpmbuild
        timeout-minutes: 5
        run: sudo apt-get update -q && sudo apt-get install -yq rpm
      - name: Build the .deb, the .rpm and the app folder
        timeout-minutes: 20
        run: |
          set -euo pipefail
          ./gradlew --no-daemon "-Pagents.version=$VERSION" :composeApp:packageDeb :composeApp:packageRpm :composeApp:packageAppImage
          mkdir -p dist
          cp composeApp/build/compose/binaries/main/deb/*.deb "dist/wildware-feed_${VERSION}_amd64.deb"
          cp composeApp/build/compose/binaries/main/rpm/*.rpm "dist/wildware-feed-${VERSION}.x86_64.rpm"
      - name: Pack the app folder into an AppImage
        timeout-minutes: 5
        run: composeApp/packaging/linux/make-appimage.sh "composeApp/build/compose/binaries/main/app/Wildware Feed" "$VERSION" dist
      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: Wildware-Feed-${{ needs.version.outputs.version }}-linux
          path: dist/*
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Load the release key
        id: key
        timeout-minutes: 2
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ "$HAS_KEY" != "true" ]; then
            echo "::notice::No Android signing secrets, so no APK or AAB this time. docs/INSTALL.md says how to add them."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build the signed APK and AAB
        if: steps.key.outputs.signed == 'true'
        timeout-minutes: 20
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon "-Pagents.version=$VERSION" :androidApp:assembleRelease :androidApp:bundleRelease
          apk=androidApp/build/outputs/apk/release/androidApp-release.apk
          # Refuse anything that came out unsigned, or signed with a debug key.
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs "$apk" | tee certs.txt
          if grep -qi "CN=Android Debug" certs.txt; then echo "::error::The APK is debug-signed."; exit 1; fi
          mkdir -p dist
          cp "$apk" "dist/Wildware-Feed-$VERSION-android.apk"
          cp androidApp/build/outputs/bundle/release/androidApp-release.aab "dist/Wildware-Feed-$VERSION-android.aab"

      - name: Delete the release key
        if: always()
        timeout-minutes: 1
        run: rm -f "$RUNNER_TEMP/release.jks"

      - if: steps.key.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: Wildware-Feed-${{ needs.version.outputs.version }}-android
          path: dist/*
          if-no-files-found: error

  release:
    # Tags only: a run by hand keeps its files as artifacts and publishes nothing. It still runs
    # when windows-sign was skipped (no SignPath settings), but never after a job failed.
    if: ${{ !cancelled() && !failure() && github.ref_type == 'tag' }}
    needs: [version, mac, windows, windows-sign, linux, android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MAC_SIGNED: ${{ needs.mac.outputs.signed }}
      MAC_NOTARIZED: ${{ needs.mac.outputs.notarized }}
      WINDOWS_SIGNED: ${{ needs.windows-sign.outputs.signed == 'true' }}
      ANDROID_SIGNED: ${{ needs.android.outputs.signed }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        with:
          path: dist
          # Only the finished files: not the unsigned Windows ones SignPath was given.
          pattern: Wildware-Feed-${{ needs.version.outputs.version }}-*
          merge-multiple: true
      - name: Write the checksums and the release notes
        timeout-minutes: 2
        run: |
          set -euo pipefail
          (cd dist && sha256sum * > SHA256SUMS.txt)
          docs/release-notes.sh "$VERSION" "$MAC_SIGNED" "$MAC_NOTARIZED" "$WINDOWS_SIGNED" "$ANDROID_SIGNED" > notes.md
          cat notes.md
      - name: Publish the release
        timeout-minutes: 10
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Wildware Feed $VERSION" --notes-file notes.md --verify-tag
