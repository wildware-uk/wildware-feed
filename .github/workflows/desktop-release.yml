name: desktop-release

# Builds the desktop installers, and on a version tag publishes them as a GitHub Release.
#
#   - Push a tag `v1.2.3` (matching agents.version in gradle.properties): builds everything and
#     publishes the release with install notes.
#   - Run it by hand from the Actions tab: builds everything and keeps the files as run artifacts
#     only. The version box can override agents.version for a test build.
#
# Never on pull requests or ordinary pushes: Mac and Windows minutes are limited.
#
# Signing is optional and turns on by itself when its secrets exist (docs/INSTALL.md lists them):
#   Mac:     MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD, APPLE_TEAM_ID, then for notarising
#            ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64.
#   Windows: WINDOWS_CERT_PFX_BASE64, WINDOWS_CERT_PASSWORD.
#   Android: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
#            Without them there is no APK or AAB at all: a debug-signed build is never published.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 1.2.3. Leave empty to use agents.version.'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        name: Work out the version
        timeout-minutes: 1
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          file_version="$(grep '^agents.version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            if [ "$version" != "$file_version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match agents.version=$file_version in gradle.properties. Bump it, commit, then tag."
              exit 1
            fi
          else
            version="${INPUT_VERSION:-$file_version}"
          fi
          # The Mac and Windows installers only take MAJOR.MINOR.PATCH, with MAJOR at least 1.
          if ! echo "$version" | grep -Eq '^[1-9][0-9]*\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$version' must look like 1.2.3 (first number at least 1)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Wildware Feed $version"

  mac:
    needs: version
    runs-on: macos-26
    # Mac minutes are billed at ten times the Linux rate; notarising can take a while, but not hours.
    timeout-minutes: 50
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
      notarized: ${{ steps.notarize.outputs.notarized }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      HAS_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' && secrets.MACOS_CERT_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
      HAS_NOTARY: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      # A keychain of its own for this run only, deleted at the end whatever happens.
      - name: Load the Developer ID certificate
        id: signing
        timeout-minutes: 3
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ "$HAS_CERT" != "true" ]; then
            echo "No Mac signing secrets: building unsigned."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/agents-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          if [ -z "$identity" ]; then
            echo "::error::The certificate holds no 'Developer ID Application' identity."
            exit 1
          fi
          case "$identity" in
            *"($TEAM_ID)"*) ;;
            *) echo "::error::The certificate's team isn't APPLE_TEAM_ID."; exit 1 ;;
          esac
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          # Compose adds the "Developer ID Application: " part itself.
          echo "identity=${identity#Developer ID Application: }" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build the .dmg (Apple silicon)
        timeout-minutes: 20
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          IDENTITY: ${{ steps.signing.outputs.identity }}
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: |
          set -euo pipefail
          args=(--no-daemon "-Pagents.version=$VERSION")
          if [ "$SIGNED" = "true" ]; then
            args+=("-Pcompose.desktop.mac.sign=true" "-Pcompose.desktop.mac.signing.identity=$IDENTITY" "-Pcompose.desktop.mac.signing.keychain=$KEYCHAIN")
          fi
          ./gradlew "${args[@]}" :composeApp:packageDmg
          mkdir -p dist
          cp composeApp/build/compose/binaries/main/dmg/*.dmg "dist/Wildware-Feed-$VERSION-mac-arm64.dmg"

      - name: Sign the .dmg itself
        if: steps.signing.outputs.signed == 'true'
        timeout-minutes: 5
        env:
          IDENTITY: ${{ steps.signing.outputs.identity }}
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: |
          codesign --force --timestamp --keychain "$KEYCHAIN" --sign "Developer ID Application: $IDENTITY" "dist/Wildware-Feed-$VERSION-mac-arm64.dmg"

      - name: Notarise and staple
        id: notarize
        timeout-minutes: 35
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          if [ "$SIGNED" != "true" ] || [ "$HAS_NOTARY" != "true" ]; then
            echo "Not notarising: needs both the signing and the App Store Connect key secrets."
            echo "notarized=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          key="$RUNNER_TEMP/asc-key.p8"
          printf '%s' "$ASC_KEY_P8" | base64 --decode > "$key"
          dmg="dist/Wildware-Feed-$VERSION-mac-arm64.dmg"
          xcrun notarytool submit "$dmg" --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait --timeout 30m
          rm -f "$key"
          xcrun stapler staple "$dmg"
          spctl --assess --type open --context context:primary-signature -v "$dmg" || true
          echo "notarized=true" >> "$GITHUB_OUTPUT"

      - name: Delete the signing keychain
        if: always()
        timeout-minutes: 2
        run: |
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/asc-key.p8"
          if [ -f "$RUNNER_TEMP/agents-signing.keychain-db" ]; then security delete-keychain "$RUNNER_TEMP/agents-signing.keychain-db"; fi

      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: Wildware-Feed-${{ needs.version.outputs.version }}-mac
          path: dist/*
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      HAS_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' && secrets.WINDOWS_CERT_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Compose downloads the WiX toolset it needs for the .msi the first time.
      - name: Build the .msi and the portable folder
        timeout-minutes: 25
        run: |
          set -euo pipefail
          ./gradlew --no-daemon "-Pagents.version=$VERSION" :composeApp:packageMsi :composeApp:createDistributable
          mkdir -p dist
          cp composeApp/build/compose/binaries/main/msi/*.msi "dist/Wildware-Feed-$VERSION-windows-x64.msi"

      # OPTIONAL SIGNING HOOK. Runs only when WINDOWS_CERT_PFX_BASE64 and WINDOWS_CERT_PASSWORD
      # are set: signs Wildware Feed.exe in the portable folder and the .msi. Without them, unsigned.
      - name: Sign (optional)
        id: sign
        timeout-minutes: 10
        shell: pwsh
        env:
          CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ($env:HAS_CERT -ne 'true') {
            Write-Output "No Windows signing secrets: building unsigned."
            "signed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX))
            $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
            $files = @('composeApp\build\compose\binaries\main\app\Wildware Feed\Wildware Feed.exe', "dist\Wildware-Feed-$env:VERSION-windows-x64.msi")
            foreach ($file in $files) {
              & $signtool.FullName sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $file
              if ($LASTEXITCODE -ne 0) { throw "signtool failed on $file" }
            }
            "signed=true" >> $env:GITHUB_OUTPUT
          } finally {
            Remove-Item -Force -ErrorAction SilentlyContinue $pfx
          }

      - name: Zip the portable folder
        timeout-minutes: 5
        run: 7z a -tzip "dist/Wildware-Feed-$VERSION-windows-x64-portable.zip" "./composeApp/build/compose/binaries/main/app/Wildware Feed"
      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: Wildware-Feed-${{ needs.version.outputs.version }}-windows
          path: dist/*
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install rpmbuild
        timeout-minutes: 5
        run: sudo apt-get update -q && sudo apt-get install -yq rpm
      - name: Build the .deb, the .rpm and the app folder
        timeout-minutes: 20
        run: |
          set -euo pipefail
          ./gradlew --no-daemon "-Pagents.version=$VERSION" :composeApp:packageDeb :composeApp:packageRpm :composeApp:packageAppImage
          mkdir -p dist
          cp composeApp/build/compose/binaries/main/deb/*.deb "dist/wildware-feed_${VERSION}_amd64.deb"
          cp composeApp/build/compose/binaries/main/rpm/*.rpm "dist/wildware-feed-${VERSION}.x86_64.rpm"
      - name: Pack the app folder into an AppImage
        timeout-minutes: 5
        run: composeApp/packaging/linux/make-appimage.sh "composeApp/build/compose/binaries/main/app/Wildware Feed" "$VERSION" dist
      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: Wildware-Feed-${{ needs.version.outputs.version }}-linux
          path: dist/*
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Load the release key
        id: key
        timeout-minutes: 2
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ "$HAS_KEY" != "true" ]; then
            echo "::notice::No Android signing secrets, so no APK or AAB this time. docs/INSTALL.md says how to add them."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build the signed APK and AAB
        if: steps.key.outputs.signed == 'true'
        timeout-minutes: 20
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon "-Pagents.version=$VERSION" :androidApp:assembleRelease :androidApp:bundleRelease
          apk=androidApp/build/outputs/apk/release/androidApp-release.apk
          # Refuse anything that came out unsigned, or signed with a debug key.
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs "$apk" | tee certs.txt
          if grep -qi "CN=Android Debug" certs.txt; then echo "::error::The APK is debug-signed."; exit 1; fi
          mkdir -p dist
          cp "$apk" "dist/Wildware-Feed-$VERSION-android.apk"
          cp androidApp/build/outputs/bundle/release/androidApp-release.aab "dist/Wildware-Feed-$VERSION-android.aab"

      - name: Delete the release key
        if: always()
        timeout-minutes: 1
        run: rm -f "$RUNNER_TEMP/release.jks"

      - if: steps.key.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: Wildware-Feed-${{ needs.version.outputs.version }}-android
          path: dist/*
          if-no-files-found: error

  release:
    # Tags only: a run by hand keeps its files as artifacts and publishes nothing.
    if: github.ref_type == 'tag'
    needs: [version, mac, windows, linux, android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MAC_SIGNED: ${{ needs.mac.outputs.signed }}
      MAC_NOTARIZED: ${{ needs.mac.outputs.notarized }}
      WINDOWS_SIGNED: ${{ needs.windows.outputs.signed }}
      ANDROID_SIGNED: ${{ needs.android.outputs.signed }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        with:
          path: dist
          merge-multiple: true
      - name: Write the checksums and the release notes
        timeout-minutes: 2
        run: |
          set -euo pipefail
          (cd dist && sha256sum * > SHA256SUMS.txt)
          docs/release-notes.sh "$VERSION" "$MAC_SIGNED" "$MAC_NOTARIZED" "$WINDOWS_SIGNED" "$ANDROID_SIGNED" > notes.md
          cat notes.md
      - name: Publish the release
        timeout-minutes: 10
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Wildware Feed $VERSION" --notes-file notes.md --verify-tag
