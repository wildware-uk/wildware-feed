# CodeQL looks through the code for security bugs (injection, unsafe file paths, weak crypto
# and the like) and files what it finds under the repository's Security tab. It is slower than
# the build, so it runs beside it and blocks nothing. The Swift app is left out: it would need a
# Mac runner.
name: codeql

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The server, the shared code and the desktop app, compiled so CodeQL can watch kotlinc.
          - language: java-kotlin
            build-mode: manual
          # The end-to-end tests and the release scripts.
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          # The workflow files themselves: untrusted input in run steps, over-broad tokens.
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false
      - if: matrix.build-mode == 'manual'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        timeout-minutes: 3
        with:
          distribution: temurin
          java-version: 21
      - if: matrix.build-mode == 'manual'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        timeout-minutes: 3
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        timeout-minutes: 5
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - if: matrix.build-mode == 'manual'
        name: Compile the Kotlin
        timeout-minutes: 25
        # CodeQL must see the compiler run, so no build cache and the compiler in this process.
        run: >-
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache
          -Dorg.gradle.jvmargs=-Xmx5g -Pkotlin.compiler.execution.strategy=in-process
          :server:compileKotlin :composeApp:compileKotlinDesktop
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        timeout-minutes: 15
        with:
          category: /language:${{ matrix.language }}
