# Deploys the server to Heroku. Started by hand only (Actions → Deploy to Heroku → Run workflow).
# Builds the container image from the distribution, smoke-tests it, pushes it to Heroku's registry
# and releases it. Needs the repository secrets HEROKU_API_KEY and HEROKU_APP; see
# server/deploy/HEROKU.md.
name: Deploy to Heroku

on:
  workflow_dispatch:

concurrency:
  group: deploy-heroku
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: heroku
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and smoke-test the image
        timeout-minutes: 20
        run: server/deploy/smoke-image.sh
      - name: Push to Heroku's registry
        timeout-minutes: 5
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP: ${{ secrets.HEROKU_APP }}
        run: |
          [ -n "$HEROKU_API_KEY" ] && [ -n "$HEROKU_APP" ] || { echo "HEROKU_API_KEY and HEROKU_APP must be set"; exit 1; }
          echo "$HEROKU_API_KEY" | docker login --username=_ --password-stdin registry.heroku.com
          docker tag wildware-feed-server:smoke "registry.heroku.com/$HEROKU_APP/web"
          docker push "registry.heroku.com/$HEROKU_APP/web"
      - name: Release
        timeout-minutes: 3
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP: ${{ secrets.HEROKU_APP }}
        run: |
          image="$(docker inspect "registry.heroku.com/$HEROKU_APP/web" --format '{{.Id}}')"
          curl -fsS -X PATCH "https://api.heroku.com/apps/$HEROKU_APP/formation" \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            -H "Accept: application/vnd.heroku+json; version=3.docker-releases" \
            -H "Content-Type: application/json" \
            -d "{\"updates\":[{\"type\":\"web\",\"docker_image\":\"$image\"}]}" -o /dev/null
          echo "released $image"
