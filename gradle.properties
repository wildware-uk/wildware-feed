org.gradle.jvmargs=-Xmx3g
kotlin.code.style=official
kotlin.native.enableKlibsCrossCompilation=true
android.useAndroidX=true

# A busy repository can drop a download now and then: retry it more, and wait longer between tries.
systemProp.org.gradle.internal.repository.max.retries=6
systemProp.org.gradle.internal.repository.initial.backoff=2000
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000

# The app's version, in one place: the desktop installers and the About text read it.
# Keep it MAJOR.MINOR.PATCH with MAJOR at least 1: the Mac and Windows installers refuse anything else.
agents.version=1.0.23
